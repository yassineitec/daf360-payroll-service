# ── DAF360 Payroll Service — application.yml ──────────────────────────────────
spring:
  application:
    name: payroll-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_PAYROLL_URL}
    username: ${DB_PAYROLL_USER}
    password: ${DB_PAYROLL_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: false
    ignore-missing-migrations: true

  mail:
    host: ${MAIL_HOST:smtp.office365.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jackson:
    deserialization:
      fail-on-unknown-properties: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8893}
  forward-headers-strategy: NATIVE
  max-http-request-header-size: 64KB

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.daf360: INFO
    org.springframework.security: WARN

app:
  jwt-secret: ${JWT_SECRET:daf360-change-me-in-production-32chars}
  jwt-public-key-path: ${JWT_PUBLIC_KEY_PATH:}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:8080,http://localhost:4205,http://localhost:4200}
  hr-api-base-url: ${HR_API_BASE_URL:http://localhost:8888}
  # ProfileSyncService reads `app.rh-service-url` via @Value, NOT hr-api-base-url.
  # It was never declared here, so it always fell back to the @Value default
  # (localhost:8888) and HR_API_BASE_URL had no effect. Both now resolve from the
  # same env var so one setting drives every HR call.
  rh-service-url: ${HR_API_BASE_URL:http://localhost:8888}
  mail-enabled: ${MAIL_ENABLED:false}
  mail-from: ${MAIL_FROM:noreply@daf360.com}
  # FX rates per paysId (key = paysId as string). 1 local unit → EUR / USD
  # Tunisia (179):       1 TND ≈ 0.300 EUR, 0.325 USD
  # Egypt   (53):        1 EGP ≈ 0.019 EUR, 0.021 USD
  # France  (62):        1 EUR ≈ 1.000 EUR, 1.090 USD
  # Saudi Arabia (152):  1 SAR ≈ 0.250 EUR, 0.267 USD
  # UAE (185):           1 AED ≈ 0.250 EUR, 0.272 USD
  fx-rates:
    "179":
      currency: TND
      eur: ${FX_TND_EUR:0.300}
      usd: ${FX_TND_USD:0.325}
    "53":
      currency: EGP
      eur: ${FX_EGP_EUR:0.019}
      usd: ${FX_EGP_USD:0.021}
    "62":
      currency: EUR
      eur: ${FX_EUR_EUR:1.0}
      usd: ${FX_EUR_USD:1.090}
    "152":
      currency: SAR
      eur: ${FX_SAR_EUR:0.250}
      usd: ${FX_SAR_USD:0.267}
    "185":
      currency: AED
      eur: ${FX_AED_EUR:0.250}
      usd: ${FX_AED_USD:0.272}
